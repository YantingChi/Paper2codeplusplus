## config.yaml\ntraining:\n  optimizer: \"Adam\"\n  learning_rate: 3e-4\n  iterations: 1000\n\nensemble:\n  size: 5\n  layers: 4\n  neurons_formula: \"64 * floor(log2(d))\"  # d is the problem dimension\n  activation: \"ReLU\"\n  loss: \"Variational Inference (ELBO)\"\n  use_dropout: false\n\ngp:\n  kernel: \"Matern5/2\"\n  hyperparameters: \"default (using BoTorch defaults)\"\n\nbo:\n  initial_samples: 10\n  total_evaluations: 200\n  random_seeds: 10\n  acquisition_function: \"Expected Improvement (EI)\"\n  dynamic_bound: \"l(x) = 0.5 - sigma_E(x)\"\n  optimizer: \"SLSQP (with pre-optimization using Adam)\"\n\nbenchmark:\n  problems: [ \"Townsend\", \"Simionescu\", \"LSQ\", \"Three-bar Truss\", \"Tension-Compression String\", \"Welded Beam\", \"Gas Transmission Compressor\", \"Pressure Vessel\", \"Speed Reducer\", \"Planetary Gear Train\", \"Rolling Element Bearing\", \"Cantilever Beam\" ]\n\nlogging:\n  verbosity: \"INFO\"\n  save_results: true\n\ngeneral:\n  device: \"cpu\"  # set to \"cuda\" if GPU is available\n  seed: 42